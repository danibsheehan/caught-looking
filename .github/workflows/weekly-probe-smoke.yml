# Rare drift check — not a chatty uptime monitor (avoids waking scale-to-zero every minute).
name: Weekly probe smoke

on:
    schedule:
        # Mondays 13:17 UTC (offset minute to reduce shared-cron stampedes)
        - cron: '17 13 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    api-probes:
        if: ${{ github.event.repository.fork == false }}
        name: Smoke API /health and /ready
        runs-on: ubuntu-latest
        steps:
            - name: Probe Cloud Run
              env:
                  API_URL: ${{ vars.API_PUBLIC_URL }}
              run: |
                  if [ -z "$API_URL" ]; then
                    echo "::error::Set repository variable API_PUBLIC_URL (Cloud Run origin, no trailing slash) for weekly probe smoke"
                    exit 1
                  fi
                  API_URL="${API_URL%/}"
                  for path in /health /ready; do
                    echo "Checking ${API_URL}${path}…"
                    ok=0
                    for i in $(seq 1 5); do
                      code=$(curl -sS -o /tmp/probe-body -w '%{http_code}' --max-time 15 "${API_URL}${path}" || true)
                      body=$(tr -d '\r' </tmp/probe-body 2>/dev/null || true)
                      if [ "$code" = "200" ]; then
                        echo "OK ${path} (attempt ${i}): ${body}"
                        ok=1
                        break
                      fi
                      echo "attempt ${i}: HTTP ${code} body=${body}"
                      sleep 5
                    done
                    if [ "$ok" != "1" ]; then
                      echo "::error::Probe ${path} did not return HTTP 200 after retries"
                      exit 1
                    fi
                  done
                  {
                    echo "## Weekly probe smoke"
                    echo ""
                    echo "| | |"
                    echo "| --- | --- |"
                    echo "| **API** | ${API_URL} |"
                    echo "| **probes** | \`GET /health\` + \`GET /ready\` → 200 |"
                  } >> "$GITHUB_STEP_SUMMARY"
