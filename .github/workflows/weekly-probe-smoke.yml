name: Weekly probe smoke

on:
  schedule:
    # Mondays 13:17 UTC (offset minute to reduce shared-cron stampedes)
    - cron: '17 13 * * 1'
  workflow_dispatch:

jobs:
  probe:
    uses: danibsheehan/dani-actions/.github/workflows/health-probe.yml@feat/health-probe
    with:
      url: ${{ vars.API_PUBLIC_URL }}
      paths: '["/health", "/ready"]'
