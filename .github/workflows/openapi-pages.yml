name: OpenAPI Docs (GitHub Pages)

on:
  push:
    branches:
      - main
    paths:
      - backend/apidocs/openapi.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build OpenAPI docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate OpenAPI spec
        working-directory: frontend
        run: |
          npm ci
          npm run api:validate

      - name: Build static docs artifact
        run: |
          mkdir -p openapi-pages
          cp docs/openapi/index.html openapi-pages/index.html
          cp backend/apidocs/openapi.yaml openapi-pages/openapi.yaml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: openapi-pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
