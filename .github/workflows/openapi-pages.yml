name: OpenAPI Docs (GitHub Pages)

on:
  push:
    branches:
      - main
    paths:
      - backend/apidocs/openapi.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: openapi-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build OpenAPI docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate OpenAPI spec
        working-directory: frontend
        run: |
          npm ci
          npm run api:validate

      - name: Build static docs artifact
        run: |
          mkdir -p openapi-pages
          cp docs/openapi/index.html openapi-pages/index.html
          cp backend/apidocs/openapi.yaml openapi-pages/openapi.yaml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: openapi-pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
