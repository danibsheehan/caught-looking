name: Cloudflare Pages (PR preview)

# Branch previews must bake in VITE_API_BASE. Without it the SPA defaults to `/api`,
# Cloudflare Pages SPA fallback returns index.html, and JSON parse fails in the UI.
on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

concurrency:
    group: pages-preview-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    preview:
        if: ${{ github.actor != 'dependabot[bot]' && github.event.repository.fork == false && vars.CLOUDFLARE_PAGES_PROJECT_NAME != '' }}
        name: Deploy PR preview (Cloudflare Pages)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            deployments: write
            pull-requests: write
            id-token: write
        env:
            GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
            GCP_REGION: ${{ vars.GCP_REGION }}
            CLOUDRUN_SERVICE_NAME: ${{ vars.CLOUDRUN_SERVICE_NAME }}
            GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
            GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

            - name: Validate Cloudflare configuration
              env:
                  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
              run: |
                  if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$CF_PROJECT" ]; then
                    echo "::error::Set secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and variable CLOUDFLARE_PAGES_PROJECT_NAME."
                    exit 1
                  fi

            - name: Resolve API base URL
              id: api
              env:
                  API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
              run: |
                  if [ -n "$API_PUBLIC_URL" ]; then
                    echo "url=$API_PUBLIC_URL" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if [ -z "$GCP_PROJECT_ID" ] || [ -z "$GCP_REGION" ] || [ -z "$CLOUDRUN_SERVICE_NAME" ] || [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] || [ -z "$GCP_DEPLOY_SERVICE_ACCOUNT" ]; then
                    echo "::error::Set repository variable API_PUBLIC_URL to the Cloud Run API origin (no trailing slash), or set GCP_* / CLOUDRUN_SERVICE_NAME so this job can look it up."
                    exit 1
                  fi
                  echo "need_gcp=true" >> "$GITHUB_OUTPUT"

            - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
              if: ${{ steps.api.outputs.need_gcp == 'true' }}
              with:
                  workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

            - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
              if: ${{ steps.api.outputs.need_gcp == 'true' }}

            - name: Read Cloud Run service URL
              if: ${{ steps.api.outputs.need_gcp == 'true' }}
              id: cloudrun-url
              run: |
                  URL=$(gcloud run services describe "$CLOUDRUN_SERVICE_NAME" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format 'value(status.url)')
                  if [ -z "$URL" ]; then
                    echo "::error::Cloud Run service URL was empty."
                    exit 1
                  fi
                  echo "url=$URL" >> "$GITHUB_OUTPUT"

            - name: Select VITE_API_BASE
              id: vite
              run: |
                  URL='${{ steps.api.outputs.url }}'
                  if [ -z "$URL" ]; then
                    URL='${{ steps.cloudrun-url.outputs.url }}'
                  fi
                  if [ -z "$URL" ]; then
                    echo "::error::VITE_API_BASE resolved empty; PR previews cannot use the Vite /api proxy."
                    exit 1
                  fi
                  echo "url=$URL" >> "$GITHUB_OUTPUT"

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Build static assets
              working-directory: frontend
              env:
                  VITE_API_BASE: ${{ steps.vite.outputs.url }}
              run: |
                  echo "Building with VITE_API_BASE=$VITE_API_BASE"
                  npm ci
                  npm run build

            - name: Publish preview to Cloudflare Pages
              uses: cloudflare/pages-action@f0a1cd58cd66095dee69bfa18fa5efd1dde93bca # v1
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
                  directory: dist
                  branch: ${{ github.head_ref }}
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}
                  workingDirectory: frontend
