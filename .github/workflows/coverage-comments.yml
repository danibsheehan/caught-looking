name: Coverage comments

on:
    workflow_run:
        workflows: [CI]
        types: [completed]

permissions:
    contents: read
    actions: read
    issues: write

concurrency:
    group: coverage-comments-${{ github.event.workflow_run.id }}
    cancel-in-progress: true

jobs:
    coverage-comments:
        name: Coverage comments
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0].number }}
        env:
            GITHUB_API_URL: ${{ github.api_url }}
            GITHUB_REPOSITORY: ${{ github.repository }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            MINIMUM_COVERAGE: '50'
            PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
            SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
            SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Post frontend coverage comment
              run: |
                  python3 .github/scripts/post_coverage_comment.py \
                    --component frontend \
                    --artifact-name frontend-cobertura \
                    --coverage-path gha-cobertura-frontend.xml

            - name: Post backend coverage comment
              run: |
                  python3 .github/scripts/post_coverage_comment.py \
                    --component backend \
                    --artifact-name backend-cobertura \
                    --coverage-path gha-cobertura.xml
