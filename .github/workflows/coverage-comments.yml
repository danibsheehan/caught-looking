name: Coverage comments

on:
    workflow_run:
        workflows: [CI]
        types: [completed]

permissions:
    contents: read
    actions: read
    issues: write
    pull-requests: write

concurrency:
    group: coverage-comments-${{ github.event.workflow_run.id }}
    cancel-in-progress: true

jobs:
    coverage-comments:
        name: Coverage comments
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0].number }}
        env:
            GITHUB_API_URL: ${{ github.api_url }}
            GITHUB_REPOSITORY: ${{ github.repository }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            MINIMUM_COVERAGE: '50'
            PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
            SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

            # download-artifact handles the artifact v4 → Azure SAS redirect correctly.
            # Manual urllib downloads that forward Authorization: Bearer fail with
            # Azure 401 InvalidAuthenticationInfo.
            # Path-filtered CI may omit one side; treat missing artifacts as skip.
            - name: Download frontend coverage artifact
              id: frontend-artifact
              continue-on-error: true
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: frontend-cobertura
                  path: coverage-frontend
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ github.event.workflow_run.id }}

            - name: Post frontend coverage comment
              if: steps.frontend-artifact.outcome == 'success'
              run: |
                  set -euo pipefail
                  echo "Downloaded frontend coverage tree:"
                  find coverage-frontend -type f -print
                  file="$(find coverage-frontend -type f -name 'gha-cobertura-frontend.xml' | head -n 1)"
                  if [ -z "${file}" ]; then
                    echo "Could not find gha-cobertura-frontend.xml under coverage-frontend" >&2
                    exit 1
                  fi
                  python3 .github/scripts/post_coverage_comment.py \
                    --component frontend \
                    --coverage-file "${file}"

            - name: Skip frontend coverage comment
              if: steps.frontend-artifact.outcome != 'success'
              run: echo 'No frontend-cobertura artifact (path-filtered or skipped job); skipping comment.'

            - name: Download backend coverage artifact
              id: backend-artifact
              continue-on-error: true
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: backend-cobertura
                  path: coverage-backend
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ github.event.workflow_run.id }}

            - name: Post backend coverage comment
              if: steps.backend-artifact.outcome == 'success'
              run: |
                  set -euo pipefail
                  echo "Downloaded backend coverage tree:"
                  find coverage-backend -type f -print
                  file="$(find coverage-backend -type f -name 'gha-cobertura.xml' | head -n 1)"
                  if [ -z "${file}" ]; then
                    echo "Could not find gha-cobertura.xml under coverage-backend" >&2
                    exit 1
                  fi
                  python3 .github/scripts/post_coverage_comment.py \
                    --component backend \
                    --coverage-file "${file}"

            - name: Skip backend coverage comment
              if: steps.backend-artifact.outcome != 'success'
              run: echo 'No backend-cobertura artifact (path-filtered or skipped job); skipping comment.'
