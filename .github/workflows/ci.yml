name: CI

# Push only on main so feature-branch work does not double-trigger with pull_request.
# Otherwise every PR update runs twice (push + pull_request). Cobertura PR comment steps
# use `if: github.event_name == 'pull_request'` so they never run on push (including main).
on:
    push:
        branches:
            - main
    # PR Cobertura steps only run for this event, never for push (merge to main).
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    frontend:
        name: Frontend (lint, typecheck, test+coverage, build)
        runs-on: ubuntu-latest
        # cobertura-action (PR-only step below) uses Issues API and Checks API.
        permissions:
            contents: read
            pull-requests: write
            issues: write
            checks: write
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm run api:validate
            - run: npm run api:types:check
            - run: npm run lint
            - run: npm run typecheck
            - name: Test with coverage (Vitest)
              run: npm run test:coverage
            # Copy out of gitignored coverage/ for cobertura-action (PR comment).
            - run: cp coverage/cobertura-coverage.xml gha-cobertura-frontend.xml
            - name: PR Cobertura comment (frontend)
              if: github.event_name == 'pull_request'
              uses: 5monkeys/cobertura-action@v14
              with:
                  pull_request_number: ${{ github.event.pull_request.number }}
                  path: frontend/gha-cobertura-frontend.xml
                  report_name: caught-looking-frontend-coverage
                  show_line: true
                  show_branch: true
                  show_class_names: false
                  show_missing: false
                  only_changed_files: false
                  skip_covered: false
                  minimum_coverage: 50
                  fail_below_threshold: true
            - run: npm run build

    backend:
        name: Backend (vet, test+coverage, build)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            issues: write
            checks: write
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.22'
                  cache-dependency-path: backend/go.sum
            - run: go mod download
            - run: go vet ./...
            - name: Test with coverage
              run: |
                  go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic
                  go install github.com/boumenot/gocover-cobertura@v1.4.0
                  # Write as gha-cobertura.xml (gitignored paths stay out of the workspace snapshot).
                  "$(go env GOPATH)/bin/gocover-cobertura" < coverage.out > gha-cobertura-raw.xml
                  python3 "$GITHUB_WORKSPACE/.github/scripts/merge_cobertura_by_file.py" gha-cobertura-raw.xml > gha-cobertura.xml
            - name: PR Cobertura comment (backend)
              if: github.event_name == 'pull_request'
              uses: 5monkeys/cobertura-action@v14
              with:
                  pull_request_number: ${{ github.event.pull_request.number }}
                  path: backend/gha-cobertura.xml
                  report_name: caught-looking-backend-coverage
                  show_line: true
                  show_branch: true
                  show_class_names: false
                  show_missing: false
                  only_changed_files: false
                  skip_covered: false
                  minimum_coverage: 50
                  fail_below_threshold: true
            - run: go build -o /dev/null .
