name: CI

# Push only on main so feature-branch work does not double-trigger with pull_request.
# Otherwise every PR update runs twice (push + pull_request); the PR coverage comment
# jobs are skipped on push because they require github.event_name == 'pull_request'.
on:
    push:
        branches:
            - main
    # Coverage comment jobs (below) only run for this event, never for push — including
    # push/merge to main — so merge commits do not post Cobertura PR comments.
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    frontend:
        name: Frontend (lint, typecheck, test+coverage, build)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - name: Test with coverage (Vitest)
              run: npm run test:coverage
            - run: npm run build
            - uses: actions/upload-artifact@v4
              with:
                  name: coverage-frontend-cobertura
                  path: frontend/coverage/cobertura-coverage.xml
                  if-no-files-found: error

    backend:
        name: Backend (vet, test+coverage, build)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.22'
                  cache-dependency-path: backend/go.sum
            - run: go mod download
            - run: go vet ./...
            - name: Test with coverage
              run: |
                  go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic
                  go install github.com/boumenot/gocover-cobertura@v1.4.0
                  "$(go env GOPATH)/bin/gocover-cobertura" < coverage.out > cobertura.xml
            - run: go build -o /dev/null .
            - uses: actions/upload-artifact@v4
              with:
                  name: coverage-backend-cobertura
                  path: backend/cobertura.xml
                  if-no-files-found: error

    pr-coverage-frontend:
        name: PR coverage comment (frontend)
        needs: [frontend]
        # Never runs on push (e.g. merge to main); requires pull_request above.
        if: github.event_name == 'pull_request' && needs.frontend.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: coverage-frontend-cobertura
            - uses: 5monkeys/cobertura-action@v14
              continue-on-error: true
              with:
                  path: frontend/coverage/cobertura-coverage.xml
                  report_name: caught-looking-frontend-coverage
                  show_line: true
                  show_branch: true
                  skip_covered: false
                  minimum_coverage: 0

    pr-coverage-backend:
        name: PR coverage comment (backend)
        needs: [backend]
        # Never runs on push (e.g. merge to main); requires pull_request above.
        if: github.event_name == 'pull_request' && needs.backend.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: coverage-backend-cobertura
            - uses: 5monkeys/cobertura-action@v14
              continue-on-error: true
              with:
                  path: backend/cobertura.xml
                  report_name: caught-looking-backend-coverage
                  show_line: true
                  show_branch: true
                  skip_covered: false
                  minimum_coverage: 0
