name: CI

# Push only on main so feature-branch work does not double-trigger with pull_request.
# Otherwise every PR update runs twice (push + pull_request). Cobertura PR comments
# run in separate PR-only jobs so tests execute with a read-only token.
on:
    push:
        branches:
            - main
    # PR Cobertura comment jobs only run for this event, never for push (merge to main).
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    frontend:
        # Must match the branch protection "required status check" name exactly.
        name: Frontend (lint, typecheck, test+coverage, build)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm run api:validate
            - run: npm run api:types:check
            - run: npm run lint
            - run: npm run format:check
            - run: npm run typecheck
            - name: Test with coverage (Vitest)
              run: npm run test:coverage
            # Copy out of gitignored coverage/ for the PR coverage comment.
            - run: cp coverage/cobertura-coverage.xml gha-cobertura-frontend.xml
            - name: Enforce frontend coverage threshold
              run: |
                  python3 - <<'PY'
                  import sys
                  import xml.etree.ElementTree as ET

                  minimum = 0.50
                  line_rate = float(ET.parse("gha-cobertura-frontend.xml").getroot().get("line-rate", "0"))
                  if line_rate < minimum:
                      print(f"Frontend coverage {line_rate:.2%} is below {minimum:.0%}", file=sys.stderr)
                      sys.exit(1)
                  print(f"Frontend coverage {line_rate:.2%}")
                  PY
            - name: Upload frontend coverage artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: frontend-cobertura
                  path: frontend/gha-cobertura-frontend.xml
                  if-no-files-found: error
            - run: npm run build

    frontend-coverage-comment:
        name: Frontend coverage comment
        runs-on: ubuntu-latest
        needs: frontend
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        permissions:
            contents: read
            issues: write
        steps:
            - name: Download frontend coverage artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: frontend-cobertura
                  path: cobertura
            - name: Post frontend coverage comment
              env:
                  COMPONENT: frontend
                  COVERAGE_PATH: cobertura/gha-cobertura-frontend.xml
                  GITHUB_API_URL: ${{ github.api_url }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_RUN_ID: ${{ github.run_id }}
                  GITHUB_SERVER_URL: ${{ github.server_url }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  MINIMUM_COVERAGE: '50'
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  python3 - <<'PY'
                  import json
                  import math
                  import os
                  import re
                  import sys
                  import urllib.error
                  import urllib.request

                  MAX_COVERAGE_BYTES = 2_000_000

                  class GithubPermissionError(Exception):
                      pass

                  def fail(message):
                      print(message, file=sys.stderr)
                      sys.exit(1)

                  def read_coverage_attrs(path):
                      with open(path, "rb") as handle:
                          data = handle.read(MAX_COVERAGE_BYTES + 1)
                      if len(data) > MAX_COVERAGE_BYTES:
                          fail(f"Coverage XML is larger than {MAX_COVERAGE_BYTES} bytes")
                      text = data.decode("utf-8", errors="replace")
                      match = re.search(r"<coverage\b([^>]*)>", text)
                      if not match:
                          fail("Could not find Cobertura <coverage> root element")
                      return {
                          key: double if double != "" else single
                          for key, double, single in re.findall(
                              r'([A-Za-z_:][-A-Za-z0-9_:.]*)\s*=\s*(?:"([^"]*)"|\'([^\']*)\')',
                              match.group(1),
                          )
                      }

                  def parse_float(attrs, key):
                      try:
                          return float(attrs[key])
                      except (KeyError, ValueError):
                          fail(f"Coverage XML is missing numeric {key!r}")

                  def parse_int(attrs, key):
                      try:
                          return int(attrs[key])
                      except (KeyError, ValueError):
                          return None

                  def github(method, path, payload=None):
                      body = None if payload is None else json.dumps(payload).encode("utf-8")
                      request = urllib.request.Request(
                          os.environ.get("GITHUB_API_URL", "https://api.github.com") + path,
                          data=body,
                          method=method,
                          headers={
                              "Accept": "application/vnd.github+json",
                              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                              "Content-Type": "application/json",
                              "X-GitHub-Api-Version": "2022-11-28",
                          },
                      )
                      try:
                          with urllib.request.urlopen(request) as response:
                              payload = response.read()
                      except urllib.error.HTTPError as error:
                          detail = error.read().decode("utf-8", errors="replace")
                          if error.code == 403:
                              raise GithubPermissionError(detail) from error
                          fail(f"GitHub API {method} {path} failed with HTTP {error.code}: {detail}")
                      return json.loads(payload.decode("utf-8")) if payload else None

                  component = os.environ["COMPONENT"]
                  attrs = read_coverage_attrs(os.environ["COVERAGE_PATH"])
                  line_rate = parse_float(attrs, "line-rate")
                  if not math.isfinite(line_rate) or line_rate < 0 or line_rate > 1:
                      fail("Coverage XML has an invalid line-rate")
                  minimum = float(os.environ["MINIMUM_COVERAGE"])
                  covered = parse_int(attrs, "lines-covered")
                  valid = parse_int(attrs, "lines-valid")
                  covered_text = f" ({covered}/{valid} lines)" if covered is not None and valid else ""
                  percent = line_rate * 100
                  status = "PASS" if percent >= minimum else "FAIL"
                  run_url = (
                      f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
                  )
                  marker = f"<!-- caught-looking:coverage:{component} -->"
                  body = "\n".join(
                      [
                          marker,
                          f"## {component.capitalize()} coverage",
                          "",
                          f"Line coverage: **{percent:.2f}%**{covered_text}",
                          f"Minimum: **{minimum:.0f}%** ({status})",
                          "",
                          f"Run: {run_url}",
                      ]
                  )

                  repo = os.environ["GITHUB_REPOSITORY"]
                  pr_number = os.environ["PR_NUMBER"]
                  existing_id = None
                  page = 1
                  try:
                      while existing_id is None:
                          comments = github("GET", f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
                          if not comments:
                              break
                          for comment in comments:
                              if marker in comment.get("body", ""):
                                  existing_id = comment["id"]
                                  break
                          page += 1

                      if existing_id is None:
                          github("POST", f"/repos/{repo}/issues/{pr_number}/comments", {"body": body})
                      else:
                          github("PATCH", f"/repos/{repo}/issues/comments/{existing_id}", {"body": body})
                  except GithubPermissionError as error:
                      print(
                          f"Skipping {component} coverage comment because GITHUB_TOKEN cannot access PR comments (HTTP 403).",
                          file=sys.stderr,
                      )
                      if str(error):
                          print(str(error), file=sys.stderr)
                  PY

    backend:
        name: Backend (vet, test+coverage, build)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
              with:
                  go-version: '1.26.4'
                  cache-dependency-path: backend/go.sum
            - run: go mod download
            - run: go vet ./...
            - name: Vulnerability scan
              run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
            - name: Test with coverage
              run: |
                  go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic
                  go install github.com/boumenot/gocover-cobertura@v1.4.0
                  # Write as gha-cobertura.xml (gitignored paths stay out of the workspace snapshot).
                  "$(go env GOPATH)/bin/gocover-cobertura" < coverage.out > gha-cobertura-raw.xml
                  python3 "$GITHUB_WORKSPACE/.github/scripts/merge_cobertura_by_file.py" gha-cobertura-raw.xml > gha-cobertura.xml
            - name: Enforce backend coverage threshold
              run: |
                  python3 - <<'PY'
                  import sys
                  import xml.etree.ElementTree as ET

                  minimum = 0.50
                  line_rate = float(ET.parse("gha-cobertura.xml").getroot().get("line-rate", "0"))
                  if line_rate < minimum:
                      print(f"Backend coverage {line_rate:.2%} is below {minimum:.0%}", file=sys.stderr)
                      sys.exit(1)
                  print(f"Backend coverage {line_rate:.2%}")
                  PY
            - name: Upload backend coverage artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: backend-cobertura
                  path: backend/gha-cobertura.xml
                  if-no-files-found: error
            - run: go build -o /dev/null .

    backend-coverage-comment:
        name: Backend coverage comment
        runs-on: ubuntu-latest
        needs: backend
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        permissions:
            contents: read
            issues: write
        steps:
            - name: Download backend coverage artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: backend-cobertura
                  path: cobertura
            - name: Post backend coverage comment
              env:
                  COMPONENT: backend
                  COVERAGE_PATH: cobertura/gha-cobertura.xml
                  GITHUB_API_URL: ${{ github.api_url }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_RUN_ID: ${{ github.run_id }}
                  GITHUB_SERVER_URL: ${{ github.server_url }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  MINIMUM_COVERAGE: '50'
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  python3 - <<'PY'
                  import json
                  import math
                  import os
