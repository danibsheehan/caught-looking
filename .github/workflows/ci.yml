name: CI

# Push only on main so feature-branch work does not double-trigger with pull_request.
# Otherwise every PR update runs twice (push + pull_request). Cobertura PR comments
# are posted by the coverage-comments job below (same-repo, non-draft PRs only).
#
# Draft PRs skip jobs until ready_for_review. Path filters keep required check names
# green on docs/skills-only (or single-side) PRs while skipping heavy steps. Optional
# e2e/sbom use a shared changes job and skip entirely when their paths are unchanged
# (skipped checks, not green no-ops). ci.yml stays in FE/BE filters only.
on:
    push:
        branches:
            - main
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    frontend:
        # Must match the branch protection "required status check" name exactly.
        name: Frontend (lint, typecheck, test+coverage, build)
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

            - name: Detect frontend-relevant changes
              if: github.event_name == 'pull_request'
              id: filter
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              with:
                  filters: |
                      frontend:
                        - 'frontend/**'
                        - 'backend/apidocs/**'
                        - 'redocly.yaml'
                        - 'Makefile'
                        - '.nvmrc'
                        - '.github/workflows/ci.yml'

            - name: Skip heavy frontend gates (path filter)
              if: github.event_name == 'pull_request' && steps.filter.outputs.frontend != 'true'
              run: echo 'No frontend-relevant paths changed; skipping npm gates.'
              working-directory: ${{ github.workspace }}

            # Always run: catches go.mod / README drift even when npm gates are path-skipped.
            - name: Stack docs vs manifests
              working-directory: ${{ github.workspace }}
              run: python3 .github/scripts/check_stack_docs.py

            # Always run: catches a new/removed .cursor/skills/ directory not wired into routing.
            - name: Skills docs vs .cursor/skills
              working-directory: ${{ github.workspace }}
              run: python3 .github/scripts/check_skills_docs.py

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
              run: npm ci

            - name: Vulnerability scan
              if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
              run: npm audit --audit-level=high

            - if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
              run: npm run api:validate

            - if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
              run: npm run api:types:check

            - if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
              run: npm run lint

            - if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
              run: npm run format:check

            - if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
              run: npm run typecheck

            - name: Test with coverage (Vitest)
              if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
              run: npm run test:coverage

            # Copy out of gitignored coverage/ for the PR coverage comment.
            # Keep the upload at workspace root so download-artifact extracts a flat file.
            - if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
              run: cp coverage/cobertura-coverage.xml "${GITHUB_WORKSPACE}/gha-cobertura-frontend.xml"

            - name: Enforce frontend coverage threshold
              if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
              run: >
                  python3 "${GITHUB_WORKSPACE}/.github/scripts/check_cobertura_line_rate.py"
                  "${GITHUB_WORKSPACE}/gha-cobertura-frontend.xml" 0.50
                  --label "Frontend coverage"

            - name: Upload frontend coverage artifact
              if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: frontend-cobertura
                  path: gha-cobertura-frontend.xml
                  if-no-files-found: error

            - if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
              run: npm run build

    backend:
        name: Backend (vet, test+coverage, build)
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

            - name: Detect backend-relevant changes
              if: github.event_name == 'pull_request'
              id: filter
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              with:
                  filters: |
                      backend:
                        - 'backend/**'
                        - 'Makefile'
                        - '.github/workflows/ci.yml'

            - name: Skip heavy backend gates (path filter)
              if: github.event_name == 'pull_request' && steps.filter.outputs.backend != 'true'
              run: echo 'No backend-relevant paths changed; skipping Go gates.'
              working-directory: ${{ github.workspace }}

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              if: github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true'
              with:
                  go-version: '1.26.6'
                  cache-dependency-path: backend/go.sum

            - if: github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true'
              run: go mod download

            - if: github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true'
              run: go vet ./...

            - name: Vulnerability scan
              if: github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true'
              run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

            - name: Test with race detector
              if: github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true'
              run: go test ./... -race -count=1

            - name: Test with coverage
              if: github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true'
              run: |
                  go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic
                  go install github.com/boumenot/gocover-cobertura@v1.4.0
                  # Write as gha-cobertura.xml (gitignored paths stay out of the workspace snapshot).
                  "$(go env GOPATH)/bin/gocover-cobertura" < coverage.out > gha-cobertura-raw.xml
                  python3 "$GITHUB_WORKSPACE/.github/scripts/merge_cobertura_by_file.py" gha-cobertura-raw.xml > "$GITHUB_WORKSPACE/gha-cobertura.xml"

            - name: Enforce backend coverage threshold
              if: github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true'
              run: >
                  python3 "${GITHUB_WORKSPACE}/.github/scripts/check_cobertura_line_rate.py"
                  "${GITHUB_WORKSPACE}/gha-cobertura.xml" 0.50
                  --label "Backend coverage"

            - name: Upload backend coverage artifact
              if: github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: backend-cobertura
                  path: gha-cobertura.xml
                  if-no-files-found: error

            - if: github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true'
              run: go build -o /dev/null .

    # Optional path detection for e2e/sbom. Required FE/BE keep in-job filters
    # (must stay green for branch protection when path-skipped).
    changes:
        name: Detect optional CI paths
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        outputs:
            e2e: ${{ steps.filter.outputs.e2e }}
            sbom: ${{ steps.filter.outputs.sbom }}
            lint: ${{ steps.filter.outputs.lint }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

            - id: filter
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              with:
                  filters: |
                      e2e:
                        - 'frontend/**'
                        - 'backend/**'
                        - 'Makefile'
                      sbom:
                        - 'backend/go.mod'
                        - 'backend/go.sum'
                        - 'frontend/package.json'
                        - 'frontend/package-lock.json'
                      lint:
                        - 'backend/**'

    # Optional (not a required status check yet): Playwright stub smoke + contract path.
    e2e:
        name: E2E (Playwright)
        needs: changes
        if: >
            (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
            needs.changes.outputs.e2e == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: '1.26.6'
                  cache-dependency-path: backend/go.sum

            - run: npm ci

            - name: Install Playwright Chromium
              run: npx playwright install chromium --with-deps

            - name: Playwright stub smoke
              run: npm run test:e2e

            - name: Playwright contract (Go API + fixtures)
              run: npm run test:e2e:contract

            - name: Playwright chaos contract (upstream 429/5xx/slow)
              run: npm run test:e2e:chaos

    # Optional (not a required status check): SPDX SBOM via Syft for supply-chain visibility.
    sbom:
        name: SBOM (Syft)
        needs: changes
        if: >
            (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
            needs.changes.outputs.sbom == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

            - name: Generate SPDX SBOM
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
              with:
                  path: .
                  format: spdx-json
                  upload-artifact: true
                  artifact-name: caught-looking-sbom
                  upload-artifact-retention: 14
                  upload-release-assets: false
                  dependency-snapshot: false

    # Optional (not a required status check yet): golangci-lint (errcheck, staticcheck, etc.).
    lint-backend:
        name: Lint (golangci-lint)
        needs: changes
        if: >
            (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
            needs.changes.outputs.lint == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: '1.26.6'
                  cache-dependency-path: backend/go.sum

            - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run ./...

    # Same-repo non-draft PRs only. Lives in CI (not workflow_run) so main pushes
    # do not spawn a skipped Coverage comments workflow run.
    coverage-comments:
        name: Coverage comments
        if: >
            github.event_name == 'pull_request' &&
            github.event.pull_request.draft == false &&
            github.event.pull_request.head.repo.full_name == github.repository
        needs: [frontend, backend]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
            pull-requests: write
        env:
            GITHUB_API_URL: ${{ github.api_url }}
            GITHUB_REPOSITORY: ${{ github.repository }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            MINIMUM_COVERAGE: '50'
            PR_NUMBER: ${{ github.event.pull_request.number }}
            SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

            # Path-filtered CI may omit one side; treat missing artifacts as skip.
            - name: Download frontend coverage artifact
              id: frontend-artifact
              continue-on-error: true
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: frontend-cobertura
                  path: coverage-frontend

            - name: Post frontend coverage comment
              if: steps.frontend-artifact.outcome == 'success'
              run: |
                  set -euo pipefail
                  echo "Downloaded frontend coverage tree:"
                  find coverage-frontend -type f -print
                  file="$(find coverage-frontend -type f -name 'gha-cobertura-frontend.xml' | head -n 1)"
                  if [ -z "${file}" ]; then
                    echo "Could not find gha-cobertura-frontend.xml under coverage-frontend" >&2
                    exit 1
                  fi
                  python3 .github/scripts/post_coverage_comment.py \
                    --component frontend \
                    --coverage-file "${file}"

            - name: Skip frontend coverage comment
              if: steps.frontend-artifact.outcome != 'success'
              run: echo 'No frontend-cobertura artifact (path-filtered or skipped job); skipping comment.'

            - name: Download backend coverage artifact
              id: backend-artifact
              continue-on-error: true
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: backend-cobertura
                  path: coverage-backend

            - name: Post backend coverage comment
              if: steps.backend-artifact.outcome == 'success'
              run: |
                  set -euo pipefail
                  echo "Downloaded backend coverage tree:"
                  find coverage-backend -type f -print
                  file="$(find coverage-backend -type f -name 'gha-cobertura.xml' | head -n 1)"
                  if [ -z "${file}" ]; then
                    echo "Could not find gha-cobertura.xml under coverage-backend" >&2
                    exit 1
                  fi
                  python3 .github/scripts/post_coverage_comment.py \
                    --component backend \
                    --coverage-file "${file}"

            - name: Skip backend coverage comment
              if: steps.backend-artifact.outcome != 'success'
              run: echo 'No backend-cobertura artifact (path-filtered or skipped job); skipping comment.'
