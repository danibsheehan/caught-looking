name: CI

# Push only on main so feature-branch work does not double-trigger with pull_request.
# Otherwise every PR update runs twice (push + pull_request). Cobertura artifacts
# are commented on by the workflow_run-based coverage-comments workflow.
on:
    push:
        branches:
            - main
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    frontend:
        # Must match the branch protection "required status check" name exactly.
        name: Frontend (lint, typecheck, test+coverage, build)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm run api:validate
            - run: npm run api:types:check
            - run: npm run lint
            - run: npm run format:check
            - run: npm run typecheck
            - name: Test with coverage (Vitest)
              run: npm run test:coverage
            # Copy out of gitignored coverage/ for the PR coverage comment.
            # Keep the upload at workspace root so download-artifact extracts a flat file.
            - run: cp coverage/cobertura-coverage.xml "${GITHUB_WORKSPACE}/gha-cobertura-frontend.xml"
            - name: Enforce frontend coverage threshold
              run: |
                  python3 - <<'PY'
                  import os
                  import sys
                  import xml.etree.ElementTree as ET

                  minimum = 0.50
                  path = os.path.join(os.environ["GITHUB_WORKSPACE"], "gha-cobertura-frontend.xml")
                  line_rate = float(ET.parse(path).getroot().get("line-rate", "0"))
                  if line_rate < minimum:
                      print(f"Frontend coverage {line_rate:.2%} is below {minimum:.0%}", file=sys.stderr)
                      sys.exit(1)
                  print(f"Frontend coverage {line_rate:.2%}")
                  PY
            - name: Upload frontend coverage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: frontend-cobertura
                  path: gha-cobertura-frontend.xml
                  if-no-files-found: error
            - run: npm run build

    backend:
        name: Backend (vet, test+coverage, build)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
            - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
              with:
                  go-version: '1.26.5'
                  cache-dependency-path: backend/go.sum
            - run: go mod download
            - run: go vet ./...
            - name: Vulnerability scan
              run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
            - name: Test with coverage
              run: |
                  go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic
                  go install github.com/boumenot/gocover-cobertura@v1.4.0
                  # Write as gha-cobertura.xml (gitignored paths stay out of the workspace snapshot).
                  "$(go env GOPATH)/bin/gocover-cobertura" < coverage.out > gha-cobertura-raw.xml
                  python3 "$GITHUB_WORKSPACE/.github/scripts/merge_cobertura_by_file.py" gha-cobertura-raw.xml > "$GITHUB_WORKSPACE/gha-cobertura.xml"
            - name: Enforce backend coverage threshold
              run: |
                  python3 - <<'PY'
                  import os
                  import sys
                  import xml.etree.ElementTree as ET

                  minimum = 0.50
                  path = os.path.join(os.environ["GITHUB_WORKSPACE"], "gha-cobertura.xml")
                  line_rate = float(ET.parse(path).getroot().get("line-rate", "0"))
                  if line_rate < minimum:
                      print(f"Backend coverage {line_rate:.2%} is below {minimum:.0%}", file=sys.stderr)
                      sys.exit(1)
                  print(f"Backend coverage {line_rate:.2%}")
                  PY
            - name: Upload backend coverage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: backend-cobertura
                  path: gha-cobertura.xml
                  if-no-files-found: error
            - run: go build -o /dev/null .
