name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, typecheck, test+coverage, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Test with coverage (Vitest)
        run: npm run test:coverage 2>&1 | tee "$GITHUB_WORKSPACE/coverage-frontend.txt"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-log
          path: ${{ github.workspace }}/coverage-frontend.txt
          if-no-files-found: error

  backend:
    name: Backend (vet, test+coverage, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - run: go vet ./...
      - name: Test with coverage
        run: |
          go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tee "$GITHUB_WORKSPACE/coverage-backend.txt"
      - run: go build -o /dev/null .
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-log
          path: ${{ github.workspace }}/coverage-backend.txt
          if-no-files-found: error

  pr-coverage-comment:
    name: PR coverage comment
    needs: [frontend, backend]
    if: github.event_name == 'pull_request' && needs.frontend.result == 'success' && needs.backend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-frontend-log
      - uses: actions/download-artifact@v4
        with:
          name: coverage-backend-log
          path: backend-log
      - name: Build markdown comment
        run: |
          {
            echo '## Code coverage'
            echo ''
            echo 'This comment is updated on each push to the PR branch.'
            echo ''
            echo '### Frontend (`npm run test:coverage`)'
            echo ''
            echo '<details>'
            echo '<summary>Full Vitest / V8 output</summary>'
            echo ''
            echo '~~~'
            cat coverage-frontend.txt
            echo '~~~'
            echo '</details>'
            echo ''
            echo '### Backend (`go test -coverprofile` + `go tool cover -func`)'
            echo ''
            echo '<details>'
            echo '<summary>Per-function coverage</summary>'
            echo ''
            echo '~~~'
            cat backend-log/coverage-backend.txt
            echo '~~~'
            echo '</details>'
          } > pr-coverage-body.md
      - uses: marocchino/sticky-pull-request-comment@v2.6.1
        continue-on-error: true
        with:
          header: caught-looking-coverage
          path: pr-coverage-body.md
