name: CodeQL

# GitHub's default (automatic) CodeQL setup narrowed itself to the "actions" language only
# on 2026-07-27, silently dropping javascript-typescript (which had run exactly once, in
# April) and never covering go at all. This advanced-setup workflow restores CodeQL for the
# repo's two real code languages; default setup stays enabled for "actions" (GitHub Actions
# workflow linting) since that category doesn't overlap with what's analyzed here.

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    schedule:
        - cron: '17 3 * * 1' # weekly, matches prior default-setup cadence

concurrency:
    group: codeql-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: go
                      build-mode: autobuild
                    - language: javascript-typescript
                      build-mode: none
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              if: matrix.language == 'go'
              with:
                  go-version: '1.26.6'
                  cache-dependency-path: backend/go.sum

            - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}

            - uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
              if: matrix.build-mode == 'autobuild'

            - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
              with:
                  category: /language:${{ matrix.language }}
