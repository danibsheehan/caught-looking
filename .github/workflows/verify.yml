# Push only on main so feature-branch work does not double-trigger with pull_request.
# Otherwise every PR update runs twice (push + pull_request).
#
# Draft PRs skip jobs until ready_for_review. Path filters keep required check names
# green on docs/skills-only (or single-side) PRs while skipping heavy steps. Optional
# e2e/sbom use a shared changes job and skip entirely when their paths are unchanged
# (skipped checks, not green no-ops). Frontend delegates to dani-actions' npm-verify.yml;
# Backend delegates to go-verify.yml (lint + test-build as its two internal jobs).
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: danibsheehan/dani-actions/.github/workflows/npm-verify.yml@v16
    with:
      packages: |
        [{"name": "frontend", "path": "frontend",
          "test-command": "npm run test:coverage",
          "build-command": "npm run build",
          "coverage-file": "coverage/cobertura-coverage.xml",
          "typecheck-command": "npm run typecheck",
          "paths": "app:\n  - 'frontend/**'\n  - 'backend/apidocs/**'\n  - 'redocly.yaml'\n  - 'Makefile'\n  - '.nvmrc'\n  - '.github/workflows/verify.yml'"}]
      doc-check-commands: |
        [{"name": "stack-docs", "command": "python3 .github/scripts/check_stack_docs.py"},
         {"name": "skills-docs", "command": "python3 .github/scripts/check_skills_docs.py"}]
      extra-checks: |
        [{"name": "api-validate", "command": "npm run api:validate", "path": "frontend",
          "paths": "app:\n  - 'frontend/**'\n  - 'backend/apidocs/**'\n  - 'redocly.yaml'\n  - 'Makefile'\n  - '.nvmrc'\n  - '.github/workflows/verify.yml'"},
         {"name": "api-types", "command": "npm run api:types:check", "path": "frontend",
          "paths": "app:\n  - 'frontend/**'\n  - 'backend/apidocs/**'\n  - 'redocly.yaml'\n  - 'Makefile'\n  - '.nvmrc'\n  - '.github/workflows/verify.yml'"}]

  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: danibsheehan/dani-actions/.github/workflows/go-verify.yml@v16
    with:
      go-version-file: backend/go.mod
      working-directory: backend
      paths: "app:\n  - 'backend/**'\n  - 'Makefile'\n  - '.github/workflows/verify.yml'"
      coverage-threshold: "0.50"
      coverage-label: "Backend coverage"
      skip-covered: false

  # Optional path detection for e2e/sbom. Required FE/BE keep in-job filters
  # (must stay green for branch protection when path-skipped).
  changes:
    name: Detect optional CI paths
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
      sbom: ${{ steps.filter.outputs.sbom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            e2e:
              - 'frontend/**'
              - 'backend/**'
              - 'Makefile'
            sbom:
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'

  # Optional (not a required status check yet): Playwright stub smoke + contract path.
  e2e:
    name: E2E (Playwright)
    needs: changes
    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Playwright stub smoke
        run: npm run test:e2e

      - name: Playwright contract (Go API + fixtures)
        run: npm run test:e2e:contract

      - name: Playwright chaos contract (upstream 429/5xx/slow)
        run: npm run test:e2e:chaos

  # Optional (not a required status check): SPDX SBOM via Syft for supply-chain visibility.
  sbom:
    name: SBOM (Syft)
    needs: changes
    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.changes.outputs.sbom == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          path: .
          format: spdx-json
          upload-artifact: true
          artifact-name: caught-looking-sbom
          upload-artifact-retention: 14
          upload-release-assets: false
          dependency-snapshot: false

