# One caller file, two jobs -- not two separate files -- because the frontend build needs
# the backend's freshly-deployed URL (VITE_API_BASE), an ordering dependency `needs:` only
# expresses within the same workflow file. Both deploy mechanisms are still fully generalized
# into dani-actions' deploy-cloud-run.yml / deploy-cloudflare-pages.yml; only this
# orchestration stays combined. See dani-actions' README "File naming conventions" for the
# general rule this is the documented exception to.
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # CORS origins are computed here (not inside deploy-cloud-run.yml) since merging
  # CORS_ALLOWED_ORIGINS with a derived Cloudflare Pages origin is caller-specific business
  # logic, not something a generic Cloud Run deploy workflow should know about. A job's
  # `uses:` (reusable workflow call) can't have sibling steps in the same job, so this has to
  # be its own job, feeding `backend` via an output.
  prepare-backend-env:
    if: ${{ github.event.repository.fork == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      env-vars-json: ${{ steps.compute.outputs.json }}
    steps:
      - name: Compute ALLOWED_ORIGINS
        id: compute
        env:
          CORS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          python3 - <<'PY'
          import json, os

          origins = [o.strip() for o in os.environ.get("CORS", "").split(",") if o.strip()]
          project = os.environ.get("CF_PROJECT", "").strip()
          if project:
              for extra in (
                  f"https://{project}.pages.dev",
                  f"https://*.{project}.pages.dev",
              ):
                  if extra not in origins:
                      origins.append(extra)
          if not origins:
              raise SystemExit("ALLOWED_ORIGINS resolved empty")
          payload = json.dumps({"ALLOWED_ORIGINS": ",".join(origins)})
          print("ALLOWED_ORIGINS=" + ",".join(origins))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"json={payload}\n")
          PY

  backend:
    needs: prepare-backend-env
    if: ${{ github.event.repository.fork == false }}
    permissions:
      contents: read
      id-token: write
    uses: danibsheehan/dani-actions/.github/workflows/deploy-cloud-run.yml@v20
    with:
      service-name: ${{ vars.CLOUDRUN_SERVICE_NAME }}
      region: ${{ vars.GCP_REGION }}
      project-id: ${{ vars.GCP_PROJECT_ID }}
      artifact-repository: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      deploy-service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      source-path: backend
      min-instances: ${{ vars.CLOUDRUN_MIN_INSTANCES || 0 }}
      max-instances: ${{ vars.CLOUDRUN_MAX_INSTANCES || 2 }}
      artifact-keep-count: ${{ vars.GCP_ARTIFACT_KEEP_COUNT || 5 }}
      startup-probe-path: /health
      smoke-check-paths: '["/health", "/ready"]'
      env-vars-json: ${{ needs.prepare-backend-env.outputs.env-vars-json }}

  frontend:
    needs: backend
    if: ${{ github.event.repository.fork == false && vars.CLOUDFLARE_PAGES_PROJECT_NAME != '' }}
    permissions:
      contents: read
      deployments: write
    uses: danibsheehan/dani-actions/.github/workflows/deploy-cloudflare-pages.yml@v20
    with:
      build-command: VITE_API_BASE="$BUILD_SECRET_1" npm run build
      dist-path: dist
      working-directory: frontend
      project-name: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
      site-public-url: ${{ vars.SITE_PUBLIC_URL }}
    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      build-secret-1: ${{ needs.backend.outputs.url }}
