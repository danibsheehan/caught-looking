name: Deploy

on:
    push:
        branches:
            - main

concurrency:
    group: deploy-main-${{ github.repository }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy-backend:
        if: ${{ github.event.repository.fork == false }}
        name: Deploy API (Cloud Run)
        runs-on: ubuntu-latest
        outputs:
            api_url: ${{ steps.cloudrun-url.outputs.url }}
        env:
            GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
            GCP_REGION: ${{ vars.GCP_REGION }}
            GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
            CLOUDRUN_SERVICE_NAME: ${{ vars.CLOUDRUN_SERVICE_NAME }}
        steps:
            - uses: actions/checkout@v4

            - uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GCP_SA_KEY }}

            - uses: google-github-actions/setup-gcloud@v2

            - name: Validate GCP configuration
              run: |
                  if [ -z "$GCP_PROJECT_ID" ] || [ -z "$GCP_REGION" ] || [ -z "$GCP_ARTIFACT_REPOSITORY" ] || [ -z "$CLOUDRUN_SERVICE_NAME" ]; then
                    echo "::error::Set GitHub repository variables: GCP_PROJECT_ID, GCP_REGION, GCP_ARTIFACT_REPOSITORY, CLOUDRUN_SERVICE_NAME"
                    exit 1
                  fi

            - name: Validate CORS (ALLOWED_ORIGINS)
              env:
                  CORS: ${{ vars.CORS_ALLOWED_ORIGINS }}
              run: |
                  if [ -z "$CORS" ]; then
                    echo "::error::Set repository variable CORS_ALLOWED_ORIGINS (comma-separated origins), e.g. https://your-project.pages.dev"
                    exit 1
                  fi

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

            - name: Build and push container image
              run: |
                  IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/api:${GITHUB_SHA}"
                  docker build -t "$IMAGE" -f backend/Dockerfile backend
                  docker push "$IMAGE"

            # ALLOWED_ORIGINS values look like https://….pages.dev — they contain ":" and ",".
            # Inline --set-env-vars / ^:^ breaks on "https://"; use --env-vars-file (JSON) instead.
            - name: Deploy to Cloud Run
              env:
                  CORS: ${{ vars.CORS_ALLOWED_ORIGINS }}
              run: |
                  IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/api:${GITHUB_SHA}"
                  python3 -c 'import json, os; json.dump({"ALLOWED_ORIGINS": os.environ["CORS"]}, open("/tmp/cr-env.json", "w"))'
                  gcloud run deploy "$CLOUDRUN_SERVICE_NAME" \
                    --image "$IMAGE" \
                    --region "$GCP_REGION" \
                    --project "$GCP_PROJECT_ID" \
                    --platform managed \
                    --allow-unauthenticated \
                    --env-vars-file=/tmp/cr-env.json

            - id: cloudrun-url
              name: Read Cloud Run service URL
              run: |
                  URL=$(gcloud run services describe "$CLOUDRUN_SERVICE_NAME" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format 'value(status.url)')
                  echo "url=$URL" >> "$GITHUB_OUTPUT"

    deploy-frontend:
        if: ${{ github.event.repository.fork == false && vars.CLOUDFLARE_PAGES_PROJECT_NAME != '' }}
        name: Deploy frontend (Cloudflare Pages)
        runs-on: ubuntu-latest
        needs: deploy-backend
        permissions:
            contents: read
            deployments: write
        steps:
            - uses: actions/checkout@v4

            - name: Validate Cloudflare configuration
              env:
                  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
              run: |
                  if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$CF_PROJECT" ]; then
                    echo "::error::Set secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and variable CLOUDFLARE_PAGES_PROJECT_NAME (Pages project must exist in Cloudflare)."
                    exit 1
                  fi

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Build static assets
              working-directory: frontend
              env:
                  VITE_API_BASE: ${{ needs.deploy-backend.outputs.api_url }}
              run: |
                  npm ci
                  npm run build

            - name: Publish to Cloudflare Pages
              uses: cloudflare/pages-action@v1
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
                  directory: dist
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}
                  workingDirectory: frontend
