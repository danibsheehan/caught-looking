name: PR guide

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-guide-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guide:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: danibsheehan/dani-actions/.github/workflows/pr-guide.yml@v11
