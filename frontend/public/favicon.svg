<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>Home plate</title>
  <rect width="32" height="32" rx="7" fill="#070b10" />
  <!-- Flat edge toward the field, point toward the catcher -->
  <path
    fill="#0d121a"
    stroke="#00f5c4"
    stroke-width="1.25"
    stroke-linejoin="round"
    d="M10 7h12l3 9-9 11-9-11 3-9Z"
  />
  <!-- Tiny rose tick at the point — reads at 16×16 without a second stroke -->
  <circle cx="16" cy="27" r="1" fill="#ff4f9a" />
</svg>
