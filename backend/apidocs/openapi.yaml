openapi: 3.0.3
info:
  title: Caught Looking API
  version: 0.1.0
  description: >-
    Read-only baseball analytics endpoints. Successful JSON responses set
    `Cache-Control` from the in-process TTL. Errors use `{"error":"<message>"}`
    (see shared response components for 400/429/500/502/504).
servers:
  - url: /
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /teams:
    get:
      summary: List teams
      operationId: listTeams
      parameters:
        - in: query
          name: sportId
          schema:
            type: string
      responses:
        "200":
          description: Teams list
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /standings:
    get:
      summary: Get standings
      operationId: getStandings
      parameters:
        - in: query
          name: season
          schema:
            type: integer
        - in: query
          name: leagueId
          schema:
            type: string
        - in: query
          name: standingsTypes
          schema:
            type: string
      responses:
        "200":
          description: Division standings
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /leaders:
    get:
      summary: Season statistical leaders
      operationId: getLeaders
      parameters:
        - in: query
          name: season
          schema:
            type: integer
        - in: query
          name: group
          description: hitting or pitching (default hitting)
          schema:
            type: string
            enum: [hitting, pitching]
        - in: query
          name: category
          description: Allowlisted MLB leaderCategories value for the group
          schema:
            type: string
        - in: query
          name: limit
          description: Max rows (1–25, default 10)
          schema:
            type: integer
            minimum: 1
            maximum: 25
      responses:
        "200":
          description: Leaders board
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /teams/{teamID}/record-timeline:
    get:
      summary: Team record over season
      operationId: getRecordTimeline
      parameters:
        - in: path
          name: teamID
          required: true
          schema:
            type: integer
        - in: query
          name: season
          schema:
            type: integer
      responses:
        "200":
          description: Team timeline
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordTimelineResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /teams/{teamID}/season-stats:
    get:
      summary: Team season stats
      operationId: getTeamSeasonStats
      parameters:
        - in: path
          name: teamID
          required: true
          schema:
            type: integer
        - in: query
          name: season
          schema:
            type: integer
      responses:
        "200":
          description: Team season stats
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSeasonStatsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /record-timelines/batch:
    get:
      summary: Fetch record timelines for many teams
      operationId: getRecordTimelinesBatch
      parameters:
        - in: query
          name: teamIds
          required: true
          schema:
            type: string
            description: Comma-separated MLB team ids
        - in: query
          name: season
          schema:
            type: integer
      responses:
        "200":
          description: Record timelines batch
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordTimelinesBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /games/for-date:
    get:
      summary: Games scheduled for date
      operationId: getGamesForDate
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: teamId
          schema:
            type: integer
      responses:
        "200":
          description: Games for date
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamesForDateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /games/{gamePk}/timeline:
    get:
      summary: Inning-by-inning game runs
      operationId: getGameTimeline
      parameters:
        - in: path
          name: gamePk
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Game timeline
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameTimelineResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /games/{gamePk}/boxscore:
    get:
      summary: Game boxscore
      operationId: getGameBoxscore
      parameters:
        - in: path
          name: gamePk
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Game boxscore
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameBoxscoreResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /games/{gamePk}/statcast:
    get:
      summary: Game statcast batted balls
      operationId: getGameStatcast
      parameters:
        - in: path
          name: gamePk
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Statcast batted-ball events
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStatcastResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /games/{gamePk}/statcast/pitches:
    get:
      summary: Game statcast pitch rows
      operationId: getGameStatcastPitches
      parameters:
        - in: path
          name: gamePk
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Statcast pitch rows
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStatcastPitchesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /players/search:
    get:
      summary: Player lookup by names string
      operationId: searchPlayers
      parameters:
        - in: query
          name: names
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayersSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /players/current-teams:
    get:
      summary: Current team for two players (single request)
      description: >-
        Same per-player data and cache behavior as GET /players/{playerID}/current-team,
        but fetches two ids in parallel. Response `players` order matches the `ids` query order.
      operationId: getPlayersCurrentTeams
      parameters:
        - in: query
          name: ids
          required: true
          description: Two comma-separated MLB person ids (distinct, positive).
          schema:
            type: string
            example: "660271,592450"
      responses:
        "200":
          description: Current team id per player
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayersCurrentTeamsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /players/{playerID}/current-team:
    get:
      summary: Player current team
      operationId: getPlayerCurrentTeam
      parameters:
        - in: path
          name: playerID
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current team id
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerCurrentTeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /players/compare:
    get:
      summary: Multi-player compare snapshot
      operationId: comparePlayers
      parameters:
        - in: query
          name: ids
          required: true
          schema:
            type: string
        - in: query
          name: season
          schema:
            type: integer
        - in: query
          name: group
          schema:
            type: string
            enum: [hitting, pitching]
        - in: query
          name: scope
          schema:
            type: string
            enum: [season, career]
      responses:
        "200":
          description: Player compare data
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayersRadarResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /players/compare/year-by-year:
    get:
      summary: Multi-player year-by-year trend
      operationId: comparePlayersYearByYear
      parameters:
        - in: query
          name: ids
          required: true
          schema:
            type: string
        - in: query
          name: group
          schema:
            type: string
            enum: [hitting, pitching]
        - in: query
          name: metric
          schema:
            type: string
      responses:
        "200":
          description: Year-by-year values
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayersYearByYearResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /players/compare/game-log:
    get:
      summary: Multi-player rolling game log
      operationId: comparePlayersGameLog
      parameters:
        - in: query
          name: ids
          required: true
          schema:
            type: string
        - in: query
          name: season
          schema:
            type: integer
        - in: query
          name: group
          schema:
            type: string
            enum: [hitting, pitching]
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Player game log compare
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayersGameLogResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /players/compare/platoon:
    get:
      summary: Multi-player platoon split comparison
      operationId: comparePlayersPlatoon
      parameters:
        - in: query
          name: ids
          required: true
          schema:
            type: string
        - in: query
          name: season
          schema:
            type: integer
        - in: query
          name: group
          schema:
            type: string
            enum: [hitting, pitching]
      responses:
        "200":
          description: Platoon split comparison
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayersPlatoonResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /league/season-baseline:
    get:
      summary: League baseline for season
      operationId: getLeagueSeasonBaseline
      parameters:
        - in: query
          name: season
          schema:
            type: integer
        - in: query
          name: group
          schema:
            type: string
            enum: [hitting, pitching]
      responses:
        "200":
          description: League baseline values
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueSeasonBaselineResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

components:
  headers:
    CacheControl:
      description: >-
        Set on successful JSON responses. `public, max-age=<seconds>` when the
        entry is cacheable (TTL from in-process cache); `private, no-store` when
        TTL is non-positive. See docs/adr/0001-cache-ttls.md.
      schema:
        type: string
        example: public, max-age=60
  responses:
    BadRequest:
      description: Invalid path or query parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Per-IP rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Local encode/decode or unexpected failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Upstream MLB/Savant failure or parse error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    GatewayTimeout:
      description: Request deadline exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
          example: invalid season
    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        abbreviation:
          type: string
        teamName:
          type: string
        leagueId:
          type: integer
        leagueName:
          type: string
        divisionId:
          type: integer
        divisionName:
          type: string
        active:
          type: boolean
      required:
        - id
        - name
        - abbreviation
        - teamName
        - leagueId
        - leagueName
        - divisionId
        - divisionName
        - active
    TeamsResponse:
      type: object
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/Team"
      required:
        - teams
    StandingTeam:
      type: object
      properties:
        teamId:
          type: integer
        teamName:
          type: string
        wins:
          type: integer
        losses:
          type: integer
        pct:
          type: string
        gamesPlayed:
          type: integer
        divisionRank:
          type: string
        gamesBack:
          type: string
        wildCardGamesBack:
          type: string
        runsScored:
          type: integer
        runsAllowed:
          type: integer
        runDifferential:
          type: integer
        streak:
          type: string
        homeWins:
          type: integer
        homeLosses:
          type: integer
        awayWins:
          type: integer
        awayLosses:
          type: integer
        lastTenWins:
          type: integer
        lastTenLosses:
          type: integer
      required:
        - teamId
        - teamName
        - wins
        - losses
        - pct
        - gamesPlayed
        - divisionRank
        - gamesBack
    StandingDivision:
      type: object
      properties:
        divisionId:
          type: integer
        divisionName:
          type: string
        leagueId:
          type: integer
        teams:
          type: array
          items:
            $ref: "#/components/schemas/StandingTeam"
      required:
        - divisionId
        - divisionName
        - leagueId
        - teams
    StandingsResponse:
      type: object
      properties:
        season:
          type: integer
        divisions:
          type: array
          items:
            $ref: "#/components/schemas/StandingDivision"
      required:
        - season
        - divisions
    RecordPoint:
      type: object
      properties:
        gameIndex:
          type: integer
        officialDate:
          type: string
        result:
          type: string
        wins:
          type: integer
        losses:
          type: integer
        pct:
          type: number
      required: [gameIndex, officialDate, result, wins, losses, pct]
    RecordTimelineResponse:
      type: object
      properties:
        teamId:
          type: integer
        season:
          type: integer
        points:
          type: array
          items:
            $ref: "#/components/schemas/RecordPoint"
        finishedGames:
          type: integer
      required: [teamId, season, points, finishedGames]
    RecordTimelinesBatchResponse:
      type: object
      properties:
        season:
          type: integer
        timelines:
          type: array
          items:
            $ref: "#/components/schemas/RecordTimelineResponse"
      required: [season, timelines]
    TeamSeasonStatsResponse:
      type: object
      properties:
        season:
          type: integer
        teamId:
          type: integer
        hitting:
          $ref: "#/components/schemas/TeamHittingLine"
        pitching:
          $ref: "#/components/schemas/TeamPitchingLine"
        venueSplits:
          $ref: "#/components/schemas/TeamVenueSplits"
      required: [season, teamId, hitting, pitching, venueSplits]
    TeamVenueSplitLine:
      type: object
      properties:
        games:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        runsScored:
          type: integer
        runsAllowed:
          type: integer
        runsPerGame:
          type: number
        runsAllowedPerGame:
          type: number
      required: [games, wins, losses, runsScored, runsAllowed]
    TeamVenueSplits:
      type: object
      properties:
        home:
          $ref: "#/components/schemas/TeamVenueSplitLine"
        away:
          $ref: "#/components/schemas/TeamVenueSplitLine"
      required: [home, away]
    TeamHittingLine:
      type: object
      properties:
        gamesPlayed:
          type: integer
        runs:
          type: integer
        runsPerGame:
          type: number
        ops:
          type: number
        obp:
          type: number
        slg:
          type: number
        avg:
          type: number
        doubles:
          type: integer
        stolenBases:
          type: integer
        homeRuns:
          type: integer
        homeRunsPerGame:
          type: number
        isolatedPower:
          type: number
        bbPct:
          type: number
        kPct:
          type: number
        babip:
          type: number
      required: [gamesPlayed, runs, runsPerGame, doubles, stolenBases]
    TeamPitchingLine:
      type: object
      properties:
        gamesPlayed:
          type: integer
        runsAllowed:
          type: integer
        runsAllowedPerGame:
          type: number
        era:
          type: number
        whip:
          type: number
        k9:
          type: number
        bb9:
          type: number
        hr9:
          type: number
        h9:
          type: number
        kbb:
          type: number
      required: [gamesPlayed, runsAllowed, runsAllowedPerGame]
    InningScore:
